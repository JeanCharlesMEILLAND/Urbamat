<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Carré arrondi accent URBAMAT (#662D91) en fond -->
  <rect width="32" height="32" rx="7" fill="#662D91"/>

  <!-- Lettre "U" stylisée — branches verticales blanches reliées par un arc -->
  <path
    d="M9.5 8 L9.5 17.5 A6.5 6.5 0 0 0 22.5 17.5 L22.5 8"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Quai : barre horizontale sous le "U" évoque la plateforme bus -->
  <rect x="6.5" y="25.5" width="19" height="2.5" rx="1.25" fill="#ffffff"/>
</svg>
